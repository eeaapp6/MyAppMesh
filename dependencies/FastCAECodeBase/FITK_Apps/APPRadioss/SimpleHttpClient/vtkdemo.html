<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VTK.js Demo</title>
  <script src="https://unpkg.com/vtk.js"></script>
  <style>
    #vtk-container {
      width: 800px;
      height: 600px;
      margin: 0 auto;
      background: #222;
    }
  </style>
</head>
<body>
  <div style="text-align:center;margin-bottom:10px;">
    <input type="file" id="file-input" accept=".vtk" />
    <label for="variable-select">云图变量：</label>
    <select id="variable-select"></select>
    <label for="render-mode-select" style="margin-left:10px;">渲染模式：</label>
    <select id="render-mode-select">
      <option value="surface">表面</option>
      <option value="wireframe">线框</option>
      <option value="points">点</option>
    </select>
    <div id="warning-msg" style="color:red;margin-top:5px;"></div>
  </div>
  <div id="vtk-container"></div>
  <script>
    // 创建渲染器、渲染窗口和交互器
    const fullScreenRenderer = vtk.Rendering.Misc.vtkFullScreenRenderWindow.newInstance({
      rootContainer: document.getElementById('vtk-container'),
      containerStyle: { width: '100%', height: '100%', position: 'relative' },
    });
    const renderer = fullScreenRenderer.getRenderer();
    const renderWindow = fullScreenRenderer.getRenderWindow();

    let actor = null;
    let mapper = null;
    let polydata = null;
    let variableNames = [];
    let scalarBarActor = null;
    let orientationMarkerWidget = null;

    function getPointScalarArrayNames(pointData) {
      // 仅列出可用于云图着色的 1 分量点变量
      return pointData
        .getArrays()
        .filter(arr => arr && arr.getName && arr.getName() && arr.getNumberOfComponents() === 1)
        .map(arr => arr.getName());
    }

    function initOrientationMarker() {
      // 左下角坐标系标记，跟随主相机交互（旋转/缩放/平移）
      if (orientationMarkerWidget) return;

      try {
        const axesActor = vtk.Rendering.Core.vtkAxesActor.newInstance();
        const interactor = renderWindow.getInteractor();
        const markerWidgetFactory = vtk.Interaction && vtk.Interaction.Widgets
          ? vtk.Interaction.Widgets.vtkOrientationMarkerWidget
          : null;

        if (!markerWidgetFactory || !interactor) {
          showWarning('当前 vtk.js 版本不支持左下角坐标系标记。');
          return;
        }

        orientationMarkerWidget = markerWidgetFactory.newInstance({
          actor: axesActor,
          interactor,
        });
        orientationMarkerWidget.setEnabled(true);
        orientationMarkerWidget.setViewportCorner(markerWidgetFactory.Corners.BOTTOM_LEFT);
        orientationMarkerWidget.setViewportSize(0.18);
        orientationMarkerWidget.setMinPixelSize(80);
        orientationMarkerWidget.setMaxPixelSize(220);
      } catch (e) {
        showWarning('坐标系标记初始化失败。');
      }
    }

    // 解析 VTK 文件并渲染
    function showWarning(msg) {
      document.getElementById('warning-msg').textContent = msg;
    }

    function clearWarning() {
      document.getElementById('warning-msg').textContent = '';
    }

    function loadVTKFile(file) {
      clearWarning();
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const vtkString = e.target.result;
          if (!/DATASET\s+POLYDATA/i.test(vtkString)) {
            showWarning('当前仅支持 legacy VTK 的 POLYDATA 文件（DATASET POLYDATA）。');
            return;
          }
          // 使用 vtk.js 解析 VTK PolyData
          const vtkParser = vtk.IO.Legacy.vtkPolyDataReader.newInstance();
          vtkParser.parseAsText(vtkString);
          polydata = vtkParser.getOutputData(0);
          if (!polydata) {
            showWarning('文件解析失败：未找到有效模型数据。');
            return;
          }

          if ((polydata.getNumberOfPolys && polydata.getNumberOfPolys() === 0) &&
              (polydata.getNumberOfStrips && polydata.getNumberOfStrips() === 0) &&
              (polydata.getNumberOfLines && polydata.getNumberOfLines() === 0) &&
              (polydata.getNumberOfVerts && polydata.getNumberOfVerts() === 0)) {
            showWarning('模型拓扑为空：未读取到单元（polys/strips/lines/verts）。');
            return;
          }

          // 获取所有点数据变量名
          const pointData = polydata.getPointData();
          variableNames = getPointScalarArrayNames(pointData);
          if (variableNames.length === 0) {
            showWarning('文件解析成功，但未找到可用于云图的节点标量变量（1分量 POINT_DATA）。');
            return;
          }
          // 更新下拉框
          updateVariableSelect(variableNames);
          document.getElementById('variable-select').value = variableNames[0];
          // 清空 actor，渲染第一个变量
          actor = null;
          mapper = null;
          renderPolyData(variableNames[0]);
        } catch (err) {
          showWarning('文件读取或解析失败，请检查文件格式。');
        }
      };
      reader.onerror = function() {
        showWarning('文件读取失败，请重试。');
      };
      reader.readAsText(file);
    }

    // 更新变量下拉框
    function updateVariableSelect(names) {
      const select = document.getElementById('variable-select');
      select.innerHTML = '';
      names.forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.text = name;
        select.appendChild(option);
      });
    }

    // 渲染 PolyData 云图
    function renderPolyData(variable) {
      // 只在首次加载时创建 actor 和 mapper
      if (!actor) {
        renderer.removeAllActors();
        mapper = vtk.Rendering.Core.vtkMapper.newInstance();
        mapper.setInputData(polydata);
        actor = vtk.Rendering.Core.vtkActor.newInstance();
        actor.setMapper(mapper);
        renderer.addActor(actor);

        // 初始化颜色条
        scalarBarActor = vtk.Rendering.Core.vtkScalarBarActor.newInstance();
        scalarBarActor.setVisibility(true);
        renderer.addActor2D(scalarBarActor);

        renderer.resetCamera();
      }
      // 切换变量时只更新 mapper
      const array = polydata.getPointData().getArrayByName(variable);
      if (!array) {
        showWarning(`变量 ${variable} 不存在于 POINT_DATA 中。`);
        return;
      }

      mapper.setColorByArrayName(variable);
      // 用字段数组名驱动着色，确保下拉框切换生效
      mapper.setScalarModeToUsePointFieldData();
      // 自动设置 lookup table 范围
      const range = array.getRange();
      const min = range[0];
      const max = range[1];
      const lookupTable = vtk.Rendering.Core.vtkColorTransferFunction.newInstance();
      if (min === max) {
        lookupTable.addRGBPoint(min - 1.0, 0, 0, 1);
        lookupTable.addRGBPoint(max + 1.0, 1, 0, 0);
      } else {
        lookupTable.addRGBPoint(min, 0, 0, 1); // 蓝色
        lookupTable.addRGBPoint(max, 1, 0, 0); // 红色
      }
      mapper.setLookupTable(lookupTable);
      mapper.setScalarVisibility(true);
      if (mapper.setUseLookupTableScalarRange) {
        mapper.setUseLookupTableScalarRange(true);
      }
      if (mapper.setScalarRange) {
        mapper.setScalarRange(min, max);
      }

      // 同步颜色条
      if (scalarBarActor) {
        scalarBarActor.setScalarsToColors(lookupTable);
        if (scalarBarActor.setAxisTitle) {
          scalarBarActor.setAxisTitle(variable);
        } else if (scalarBarActor.setAxisLabel) {
          scalarBarActor.setAxisLabel(variable);
        }
      }

      clearWarning();
      updateRenderMode();
      renderWindow.render();
    }

    // 渲染模式切换
    function updateRenderMode() {
      if (!actor) return;
      const mode = document.getElementById('render-mode-select').value;
      if (mode === 'surface') {
        actor.getProperty().setRepresentation(2); // Surface
      } else if (mode === 'wireframe') {
        actor.getProperty().setRepresentation(1); // Wireframe
      } else if (mode === 'points') {
        actor.getProperty().setRepresentation(0); // Points
      }
      renderWindow.render();
    }

    // 文件拾取事件
    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        loadVTKFile(file);
      }
    });

    // 下拉框切换变量
    document.getElementById('variable-select').addEventListener('change', function(e) {
      if (polydata) {
        renderPolyData(e.target.value);
      }
    });

    // 渲染模式切换事件
    document.getElementById('render-mode-select').addEventListener('change', function() {
      updateRenderMode();
    });

    // 初始渲染空场景
    initOrientationMarker();
    renderer.resetCamera();
    renderWindow.render();
  </script>
</body>
</html>

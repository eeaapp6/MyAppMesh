<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple FastCAE HTTP Client</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #61717f;
      --line: #d5dee6;
      --accent: #0b79d0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    label {
      color: var(--muted);
      font-size: 14px;
    }

    input, select, textarea, button {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      width: 100%;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }

    button {
      width: auto;
      min-width: 92px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Simple FastCAE HTTP Client (HTML)</h1>
      <div class="grid">
        <label for="url">URL</label>
        <input id="url" type="text" value="http://127.0.0.1:2222/">
      </div>
      <div class="grid">
        <label for="method">Method</label>
        <select id="method">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
        </select>
      </div>
      <div class="grid" style="grid-template-columns: 1fr;">
        <label for="requestBody">Request Body</label>
        <textarea id="requestBody" placeholder="POST body (plain text or JSON)"></textarea>
      </div>
      <div class="actions">
        <button id="sendBtn" type="button">Send</button>
        <div id="status" class="status">Ready</div>
      </div>
      <div class="hint">If body is not empty and method is GET, request will be sent as POST.</div>
      <div class="hint">POST now sends plain text body to reduce OPTIONS preflight issues.</div>
      <div class="hint">If browser still blocks cross-origin calls, serve this file via a local static server or configure CORS on the server.</div>
    </div>

    <div class="card">
      <div class="grid" style="grid-template-columns: 1fr; margin-bottom: 0;">
        <label for="response">Response</label>
        <textarea id="response" readonly></textarea>
      </div>
    </div>
  </div>

    <!-- JS测试区域 -->
    <div class="container">
      <div class="card">
        <button id="testJsBtn" type="button">测试JS</button>
      </div>
    </div>

  <script>
    const urlInput = document.getElementById("url");
    const methodSelect = document.getElementById("method");
    const requestBody = document.getElementById("requestBody");
    const responseBox = document.getElementById("response");
    const statusText = document.getElementById("status");
    const sendBtn = document.getElementById("sendBtn");

    function setUiEnabled(enabled) {
      urlInput.disabled = !enabled;
      methodSelect.disabled = !enabled;
      requestBody.disabled = !enabled;
      sendBtn.disabled = !enabled;
    }

    async function sendRequest() {
      const rawUrl = urlInput.value.trim();
      if (!rawUrl) {
        statusText.textContent = "Invalid URL";
        return;
      }

      let method = methodSelect.value;
      const body = requestBody.value;
      if (method === "GET" && body.length > 0) {
        method = "POST";
      }

      responseBox.value = "";
      setUiEnabled(false);
      statusText.textContent = "Sending (" + method + ")...";

      try {
        const options = { method };
        if (method === "POST") {
          // Use a simple request header so browser is less likely to send preflight OPTIONS.
          options.headers = {
            "Content-Type": "text/plain;charset=UTF-8"
          };
          options.body = body;
        }

        const resp = await fetch(rawUrl, options);
        const text = await resp.text();

        const contentType = (resp.headers.get("content-type") || "").toLowerCase();
        let responseText = text;
        if (contentType.includes("application/json") && text) {
          try {
            responseText = JSON.stringify(JSON.parse(text), null, 2);
          } catch (_) {
          }
        }

        let output = "Status: " + resp.status + " " + resp.statusText + "\n\n";
        if (!resp.ok) {
          output += "Error Response:\n";
          output += responseText || ("HTTP " + resp.status + " " + resp.statusText);
          statusText.textContent = "Failed (" + resp.status + ")";
        } else {
          output += responseText;
          statusText.textContent = "Done";
        }

        responseBox.value = output;
      } catch (err) {
        let output = "Status: N/A\n\n";
        output += "Network Error: " + (err && err.message ? err.message : String(err));
        responseBox.value = output;
        statusText.textContent = "Failed";
      } finally {
        setUiEnabled(true);
      }
    }

    sendBtn.addEventListener("click", sendRequest);
      // JS测试按钮功能
      document.getElementById("testJsBtn").addEventListener("click", function() {
        alert("Hello, JS!");
      });
  </script>
</body>
</html>
